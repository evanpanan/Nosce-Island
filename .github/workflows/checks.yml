name: Nosce checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: nosce-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r Server/requirements.lock -r Server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: Server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test Tests/Web/public-market.test.cjs
  ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash Tests/run-wire-checks.sh
      - run: bash Tests/run-widget-checks.sh
      - run: xcodebuild -project NosceIsland.xcodeproj -scheme NosceIsland -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: nosce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r Server/requirements.lock -r Server/requirements-dev.txt
      - run: python -m pytest -q tests/test_vercel.py
        working-directory: Server
        env:
          NOSCE_TEST_POSTGRES: postgresql://postgres:test-only-password@localhost:5432/nosce_test

  website-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node Tests/Web/responsive-layout.cjs
