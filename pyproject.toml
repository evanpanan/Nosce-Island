[project]
name = "nosce-island-api"
version = "0.6.8"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "httpx[http2,socks]==0.28.1",
    "websockets==16.0",
    "cryptography==50.0.2",
    "PyJWT==2.15.1",
    "pydantic==2.14.1",
    "python-socks[asyncio]==3.2.1",
    "app-store-server-library==3.1.2",
    "psycopg[binary]==3.3.6",
]

[tool.vercel]
entrypoint = "app:app"
