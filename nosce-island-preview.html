<script>
'use strict';
const WAVE='<svg class="wave" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M2 17h5l4-11 5 21 5-16 4 6h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const icons={plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/>',settings:'<path d="M4 7h8m5 0h3M4 17h3m5 0h8"/><circle cx="14.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',arrow:'<path d="m9 5 7 7-7 7"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>',play:'<path d="m9 5 10 7-10 7Z"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>',globe:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',color:'<path d="M5 20V10m7 10V4m7 16v-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const icon=(name,size=18)=>'<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[name]||icons.info)+'</svg>';
const seeds=[{id:'BTC',name:'Bitcoin',price:68000,change:2.34},{id:'ETH',name:'Ethereum',price:2500,change:1.82},{id:'SOL',name:'Solana',price:150.25,change:-1.24},{id:'HYPE',name:'Hyperliquid',price:24.18,change:3.46},{id:'xyz:TSLA',name:'Tesla',price:250.16,change:1.68},{id:'xyz:NVDA',name:'NVIDIA',price:130.24,change:-.82},{id:'xyz:AAPL',name:'Apple',price:220.18,change:.64},{id:'xyz:BABA',name:'Alibaba',price:100.21,change:1.12},{id:'xyz:GOLD',name:'Gold',price:2600.12,change:.48}];
const byId=id=>seeds.find(a=>a.id===id)||{id,name:id.split(':').pop(),price:100,change:0};
let prefs;try{prefs=JSON.parse(localStorage.getItem('nosce-preview-v1')||'{}')}catch{prefs={}}
const state={tab:'watch',lang:prefs.lang==='en'?'en':'zh',selected:Array.isArray(prefs.selected)?prefs.selected.filter(id=>typeof id==='string').slice(0,2):['BTC','SOL'],redUp:!!prefs.redUp,light:!!prefs.light,active:false,expanded:false,mode:'demo',filter:'all',search:'',quotes:{},history:{},connection:'',catalog:[...seeds],catalogBusy:false};
if(!state.selected.length)state.selected=['BTC'];
let ws=null,reconnectTimer=null,pingTimer=null,watchdog=null,reconnectDelay=1000,generation=0,catalogGeneration=0,lastData=0,toastTimer;
const t=(zh,en)=>state.lang==='zh'?zh:en;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const symbol=id=>id.split(':').pop();
const price=value=>Number.isFinite(value)?'$'+value.toLocaleString('en-US',{minimumFractionDigits:value<1?4:2,maximumFractionDigits:value<1?4:2}):'—';
const change=value=>Number.isFinite(value)?(value>=0?'+':'')+value.toFixed(2)+'%':'—';
const gain=value=>value===null||value===undefined?'':((value>=0)!==state.redUp?'gain':'loss');
const save=()=>{try{localStorage.setItem('nosce-preview-v1',JSON.stringify({lang:state.lang,selected:state.selected,redUp:state.redUp,light:state.light}))}catch{}};
function toast(text){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
function coin(id){const s=symbol(id);return '<span class="coin '+(s==='ETH'?'eth':s==='SOL'?'sol':id.includes(':')?'stock':'')+'">'+esc(s==='BTC'?'₿':s==='ETH'?'Ξ':s==='SOL'?'≋':s.slice(0,2))+'</span>'}
function quote(id){return state.mode==='demo'?{...byId(id),time:0}:state.quotes[id]}
function stale(q){return state.mode==='live'&&(!q||Date.now()-q.time>30000)}
function spark(id){let points=state.mode==='demo'?[30,32,28,31,20,24,23,15,18,10,13,5,8]:state.history[id]||[];const q=quote(id);let color=gain(q?.change)==='loss'?'var(--red)':'var(--mint)';if(points.length<2)return '<div class="chart"></div>';let min=Math.min(...points),max=Math.max(...points),span=max-min||1;const d=points.map((v,i)=>(i?'L':'M')+(i/(points.length-1)*110+1).toFixed(1)+' '+(43-(v-min)/span*36).toFixed(1)).join(' ');return '<svg class="chart" viewBox="0 0 112 46" aria-hidden="true"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>'}
function renderIsland(){const el=document.getElementById('island'),q=quote(state.selected[0]);el.classList.toggle('expanded',state.expanded);el.setAttribute('aria-expanded',String(state.expanded));el.setAttribute('aria-label',t('展开或收起模拟灵动岛','Expand or collapse simulated island'));if(state.expanded){el.innerHTML='<div class="island-top"><span class="island-title">NOSCE ISLAND</span><span class="pilltitle">'+(state.mode==='demo'?t('示例数据','SAMPLE DATA'):t('合约标记价','PERP MARK'))+'</span></div>'+state.selected.map(id=>{const q=quote(id);return '<div class="island-row"><b>'+esc(symbol(id))+'</b><span class="price">'+price(q?.price)+'</span><small class="'+gain(q?.change)+'">'+change(q?.change)+'</small></div>'}).join('')+'<div class="pilltitle" style="margin-top:9px">'+t('网页模拟 · 点击收起','Web simulation · tap to collapse')+'</div>'}else{el.innerHTML=WAVE+'<span class="symbol">'+(state.active?esc(symbol(state.selected[0])):'NOSCE')+'</span><span class="price">'+(state.active?price(q?.price):t('轻触展开','Tap to expand'))+'</span>'}document.getElementById('islandHint').textContent=state.active?t('网页盯盘演示中 · 点击上方展开','Web watch active · tap above to expand'):t('模拟灵动岛 · 仅在网页内展示','Simulated island · inside this webpage');}
function card(id){const q=quote(id),item=byId(id);const time=q?.time?new Date(q.time).toLocaleTimeString(state.lang==='zh'?'zh-CN':'en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';return '<article class="quote"><div class="quote-head">'+coin(id)+'<div><b>'+esc(symbol(id))+'</b><p class="name">'+esc(item.name)+'</p></div><span class="tag">'+(id.includes(':')?'HIP-3':t('加密合约','PERP'))+'</span></div><div class="quote-body"><div><div class="quote-price">'+price(q?.price)+'</div><div class="quote-change '+gain(q?.change)+'">'+change(q?.change)+' <span style="color:var(--muted);margin-left:4px">24h</span></div></div>'+spark(id)+'</div><div class="quote-foot"><span class="source">'+(state.mode==='demo'?t('示例数据 · 非当前行情','Sample data · not current prices'):'Hyperliquid · '+esc(id))+'</span><span class="'+(stale(q)?'stale':'')+'">'+(state.mode==='demo'?'DEMO':stale(q)?t('等待 / 已过期','Waiting / stale'):t('接收 ','Received ')+time)+'</span></div></article>'}
function watch(){return '<div class="brand">'+WAVE+'<span class="brand-word">NOSCE ISLAND</span><span class="alpha">PREVIEW 0.2</span></div><div class="hero"><h1>'+t('抬眼，即知行情。','Markets. At a glance.')+'</h1><p class="subtitle">'+t('少一次打开，多一点专注。','Stay in the moment. Keep markets in sight.')+'</p></div><section class="session '+(state.active?'active':'')+'"><div class="session-top"><span class="dot"></span><b>'+t(state.active?'网页演示已开启':'随时开始盯盘',state.active?'Web preview is active':'Ready when you are')+'</b><span class="modebadge">'+(state.mode==='demo'?t('示例模式','DEMO'):t('实时连接','LIVE FEED'))+'</span></div><div class="session-main"><div><h2>'+t(state.active?'行情，就在上方。':'你的行情，放在眼前。',state.active?'Your market, up above.':'Your market. In sight.')+'</h2><p>'+t('无强制广告 · 无付费倒计时','No forced ads. No paid countdown.')+'</p></div><span class="session-icon">'+WAVE+'</span></div><button class="action" data-action="activity">'+icon(state.active?'stop':'play',16)+t(state.active?'结束网页演示':'开启灵动岛演示',state.active?'Stop web demo':'Try the island demo')+'</button></section><div class="section-title"><h2>'+t('正在关注','Your watch')+'</h2><button class="plain" data-tab="list">'+icon('plus',15)+t('管理','Manage')+'</button></div><div id="cards">'+state.selected.map(card).join('')+'</div><div class="notice">'+icon('info',14)+'<p>'+t('这是手机交互预览，灵动岛为网页模拟。可在设置切换 Hyperliquid 实时数据；网页无法控制 iPhone 系统灵动岛。','This is an interactive web preview. The island is simulated. Enable Hyperliquid live data in Settings; this page cannot control the iPhone system island.')+'</p></div><p class="footer-note">DESIGNED TO KEEP YOU PRESENT</p>'}
function rows(){const list=state.catalog.filter(a=>(state.filter==='all'||(state.filter==='crypto'?!a.id.includes(':'):a.id.includes(':')))&&a.id.toLowerCase().includes(state.search.toLowerCase()));return list.length?list.slice(0,150).map(a=>'<button class="asset-row" data-asset="'+esc(a.id)+'" aria-pressed="'+state.selected.includes(a.id)+'">'+coin(a.id)+'<div><b>'+esc(symbol(a.id))+'</b><p>'+esc(a.id)+' · '+t('永续合约','Perpetual')+'</p></div><span class="add '+(state.selected.includes(a.id)?'selected':'')+'">'+icon(state.selected.includes(a.id)?'check':'plus',22)+'</span></button>').join(''):'<div class="empty">'+t('未找到该品种。覆盖以平台实际上架为准。','No matches. Coverage depends on actual listings.')+'</div>'}
function list(){return '<h1 class="page-title">'+t('自选行情','Watchlist')+'</h1><label class="search">'+icon('search')+'<span class="sr-only">'+t('搜索合约代码','Search contract')+'</span><input id="search" type="search" autocomplete="off" placeholder="'+t('搜索 BTC、TSLA、平台代码','Search BTC, TSLA, market code')+'" value="'+esc(state.search)+'"></label><div class="segments">'+[['all','全部','All'],['crypto','加密合约','Crypto'],['hip3','HIP-3','HIP-3']].map(a=>'<button data-filter="'+a[0]+'" class="'+(state.filter===a[0]?'active':'')+'">'+t(a[1],a[2])+'</button>').join('')+'</div><div class="section-title"><h2>'+t('已选择','Selected')+'</h2><small>'+state.selected.length+' / 2</small></div><div class="list-group">'+state.selected.map(id=>'<button class="asset-row" data-asset="'+esc(id)+'">'+coin(id)+'<div><b>'+esc(symbol(id))+'</b><p>'+esc(id)+'</p></div><span class="add selected">'+icon('check',22)+'</span></button>').join('')+'</div><div class="section-title"><h2>'+t('浏览市场','Explore markets')+'</h2><button class="plain" data-action="catalog">'+(state.catalogBusy?t('加载中…','Loading…'):t('刷新列表','Refresh'))+'</button></div><div class="list-group" id="assetRows">'+rows()+'</div><div class="notice">'+icon('info',14)+'<p>'+t('HIP-3 包含股票相关及其他合约，不是港美股交易所官方报价。港股覆盖以平台实际上架为准；同名合约按市场分别显示。','HIP-3 includes equity-linked and other contracts, not official stock exchange quotes. HK coverage depends on actual listings; identical symbols remain separate by market.')+'</p></div>'}
function setting(label,key,on,ic){return '<button class="setting" data-setting="'+key+'" role="switch" aria-checked="'+on+'"><span class="setting-icon">'+icon(ic)+'</span>'+label+'<span class="toggle '+(on?'on':'')+'"></span></button>'}
function settings(){return '<h1 class="page-title">'+t('设置','Settings')+'</h1><p class="settings-label">'+t('显示偏好','DISPLAY')+'</p><div class="list-group">'+setting(t('浅色外观','Light appearance'),'light',state.light,'sun')+setting(t('红涨绿跌','Red for gains'),'redUp',state.redUp,'color')+'<button class="setting" data-action="language"><span class="setting-icon">'+icon('globe')+'</span>'+t('语言','Language')+'<span class="value">'+t('简体中文','English')+'</span>'+icon('arrow',14)+'</button></div><p class="settings-label">'+t('行情数据','MARKET DATA')+'</p><div class="list-group"><div class="setting" style="display:block"><div style="display:flex;align-items:center">'+t('数据模式','Data mode')+'<span class="value">Hyperliquid</span></div><div class="data-switch"><button data-mode="demo" class="'+(state.mode==='demo'?'active':'')+'">'+t('示例预览','Sample data')+'</button><button data-mode="live" class="'+(state.mode==='live'?'active':'')+'">'+t('实时数据','Live data')+'</button></div><p style="color:var(--muted);font-size:10px;margin-top:12px" id="connection">'+esc(state.mode==='demo'?t('当前使用固定示例价格','Fixed sample prices are active'):state.connection)+'</p></div></div><p class="setting-description">'+t('实时模式显示永续合约标记价。断网后保留旧报价并标记过期，不自动替换为示例数据。时间为本机接收时间。','Live mode shows perpetual mark prices. On failure, old quotes are retained and marked stale, never replaced with samples. Times indicate local receipt.')+'</p><p class="settings-label">'+t('关于此预览','ABOUT THIS PREVIEW')+'</p><div class="list-group"><div class="setting"><span class="setting-icon">'+icon('check')+'</span>'+t('三个页面均可交互','Three interactive screens')+'</div><div class="setting"><span class="setting-icon">'+icon('check')+'</span>'+t('无广告、无登录、无收费','No ads, login or payments')+'</div><div class="setting"><span class="setting-icon">'+icon('info')+'</span>'+t('灵动岛为网页内模拟','Island is a web simulation')+'</div></div><div class="note-panel">'+t('请勿把网页模拟与原生 App 的后台能力混淆。真实 iOS 版的后台持续行情，需要另行配置服务器及苹果推送服务。','The simulated island does not represent native background behavior. Continuous background updates in the iOS app require a server and Apple push configuration.')+'</div><div class="about-brand">'+WAVE+'Nosce Island</div><p class="footer-note">MOBILE INTERACTIVE PREVIEW · 0.2</p>'}
function render(){document.body.classList.toggle('light',state.light);document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';document.getElementById('previewLabel').textContent=t('手机交互预览','MOBILE INTERACTIVE PREVIEW');document.getElementById('main').innerHTML='<div class="page">'+(state.tab==='watch'?watch():state.tab==='list'?list():settings())+'</div>';document.getElementById('nav').innerHTML=[['watch','盯盘','Watch','wave'],['list','自选','Watchlist','star'],['settings','设置','Settings','settings']].map(a=>'<button data-tab="'+a[0]+'" class="'+(state.tab===a[0]?'active':'')+'" aria-current="'+(state.tab===a[0]?'page':'false')+'">'+(a[3]==='wave'?WAVE:icon(a[3]))+'<span>'+t(a[1],a[2])+'</span></button>').join('');renderIsland();}
function refreshQuotes(){renderIsland();if(state.tab==='watch'){const cards=document.getElementById('cards');if(cards)cards.innerHTML=state.selected.map(card).join('')}if(state.tab==='settings'){const el=document.getElementById('connection');if(el)el.textContent=state.connection}}
function resetConnection(){generation++;clearTimeout(reconnectTimer);clearInterval(pingTimer);clearInterval(watchdog);if(ws){ws.onclose=null;ws.onerror=null;ws.onmessage=null;ws.close();ws=null}}
function ingest(id,ctx){const mark=Number(ctx?.markPx),previous=Number(ctx?.prevDayPx);if(!state.selected.includes(id)||!Number.isFinite(mark)||mark<=0)return;const pct=Number.isFinite(previous)&&previous>0?(mark/previous-1)*100:null;state.quotes[id]={price:mark,change:Number.isFinite(pct)?pct:null,time:Date.now()};const h=state.history[id]||(state.history[id]=[]);h.push(mark);if(h.length>45)h.shift();lastData=Date.now()}
function connect(){resetConnection();if(state.mode!=='live'||document.hidden)return;const token=generation;state.connection=t('正在连接 Hyperliquid…','Connecting to Hyperliquid…');refreshQuotes();lastData=Date.now();let received=false;try{ws=new WebSocket('wss://api.hyperliquid.xyz/ws')}catch{retry(token);return}ws.onopen=()=>{if(token!==generation)return;for(const id of state.selected)ws.send(JSON.stringify({method:'subscribe',subscription:{type:'activeAssetCtx',coin:id}}));pingTimer=setInterval(()=>{if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({method:'ping'}))},20000);watchdog=setInterval(()=>{if(Date.now()-lastData>30000)ws?.close()},10000)};ws.onmessage=e=>{if(token!==generation)return;try{const m=JSON.parse(e.data);if(m.channel==='error'){ws.close();return}if(m.channel==='activeAssetCtx'){ingest(m.data.coin,m.data.ctx);received=true;reconnectDelay=1000;state.connection=t('Hyperliquid · 实时连接中','Hyperliquid · streaming');refreshQuotes()}}catch{}};ws.onerror=()=>{state.connection=t('连接受限，正在重试','Connection limited. Retrying');refreshQuotes()};ws.onclose=()=>{if(token!==generation)return;clearInterval(pingTimer);clearInterval(watchdog);if(received)reconnectDelay=1000;retry(token)}}
function retry(token){if(token!==generation||state.mode!=='live'||document.hidden)return;state.connection=t('连接中断，保留旧报价 · 正在重试','Disconnected. Last quotes retained · retrying');refreshQuotes();reconnectTimer=setTimeout(()=>connect(),reconnectDelay);reconnectDelay=Math.min(30000,reconnectDelay*2)}
async function info(body){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);try{const response=await fetch('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});if(!response.ok)throw Error('HTTP '+response.status);return await response.json()}finally{clearTimeout(timer)}}
async function loadCatalog(){if(state.catalogBusy)return;state.catalogBusy=true;const token=++catalogGeneration;if(state.tab==='list')render();try{const results=await Promise.allSettled([info({type:'meta',dex:''}),info({type:'meta',dex:'xyz'})]);if(token!==catalogGeneration)return;let count=0;for(const result of results){if(result.status!=='fulfilled')continue;count++;for(const a of result.value.universe||[]){if(a.isDelisted||typeof a.name!=='string')continue;if(!state.catalog.some(x=>x.id===a.name))state.catalog.push({id:a.name,name:a.name})}}toast(count?t('市场列表已更新','Markets updated'):t('加载失败，请检查网络后重试','Unable to load. Check network and retry'))}catch{toast(t('暂时无法加载市场','Markets unavailable'))}finally{state.catalogBusy=false;if(state.tab==='list')render()}}
function changeMode(mode){if(state.mode===mode)return;resetConnection();state.mode=mode;state.quotes={};state.history={};state.connection='';reconnectDelay=1000;render();if(mode==='live')connect();toast(mode==='live'?t('已切换实时数据，正在连接','Live mode selected. Connecting'):t('已切换示例预览','Sample mode selected'))}
function navigate(tab){state.tab=tab;render();window.scrollTo({top:0,behavior:'instant'})}
function toggleAsset(id){if(state.selected.includes(id)){if(state.selected.length===1){toast(t('至少保留一个资产','Keep at least one asset'));return}state.selected=state.selected.filter(x=>x!==id)}else{if(state.selected.length>=2){toast(t('最多选择两个，请先移除一个','Two assets maximum. Remove one first'));return}state.selected.push(id)}save();render();if(state.mode==='live')connect()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){navigate(b.dataset.tab);return}if(b.dataset.asset){toggleAsset(b.dataset.asset);return}if(b.dataset.filter){state.filter=b.dataset.filter;render();return}if(b.dataset.setting){state[b.dataset.setting]=!state[b.dataset.setting];save();render();return}if(b.dataset.mode){changeMode(b.dataset.mode);return}if(b.id==='island'){state.expanded=!state.expanded;renderIsland();return}if(b.id==='langButton'||b.dataset.action==='language'){state.lang=state.lang==='zh'?'en':'zh';save();render();return}if(b.dataset.action==='catalog'){loadCatalog();return}if(b.dataset.action==='activity'){state.active=!state.active;state.expanded=state.active;render();window.scrollTo({top:0,behavior:'smooth'});toast(state.active?t('模拟已开启，仅在本网页显示','Simulation started, inside this page only'):t('网页演示已结束','Web demo stopped'))}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;document.getElementById('assetRows').innerHTML=rows()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)resetConnection();else if(state.mode==='live')connect()});
window.addEventListener('offline',()=>{state.connection=t('网络已断开，保留旧报价','Offline. Last quotes retained');refreshQuotes()});window.addEventListener('online',()=>{if(state.mode==='live')connect()});
setInterval(()=>{if(state.mode==='live')refreshQuotes()},5000);render();
</script></body></html>
